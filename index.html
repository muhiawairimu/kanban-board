<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow | Interactive Kanban Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .kanban-column { min-height: 500px; }
    .dragging { opacity: 0.4; transform: scale(0.98); }
    .drag-over { background-color: rgba(99, 102, 241, 0.1); border-color: rgba(99, 102, 241, 0.4); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-40 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 bg-indigo-600/20 text-indigo-400 rounded-xl border border-indigo-500/30">
          <i class="fa-solid fa-square-kanban text-2xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">TaskFlow</h1>
          <p class="text-xs text-slate-400">Drag & Drop Workflow Management</p>
        </div>
      </div>

      <!-- Controls & Search -->
      <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
        <div class="relative flex-1 md:w-64">
          <input type="text" id="search-input" placeholder="Search tasks..." 
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-500"></i>
        </div>

        <select id="priority-filter" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
          <option value="all">All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>

        <button id="btn-add-task" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl text-sm transition flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Task
        </button>
      </div>
    </div>
  </header>

  <!-- Kanban Board Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

      <!-- Column: To Do -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col gap-4">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-slate-400"></span>
            <h2 class="font-bold text-slate-200 text-sm uppercase tracking-wider">To Do</h2>
          </div>
          <span id="count-todo" class="px-2.5 py-0.5 bg-slate-800 border border-slate-700 text-slate-400 text-xs rounded-full font-semibold">0</span>
        </div>
        <div id="col-todo" data-status="todo" class="kanban-column flex flex-col gap-3 transition-colors rounded-xl p-1"></div>
      </div>

      <!-- Column: In Progress -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col gap-4">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-400"></span>
            <h2 class="font-bold text-slate-200 text-sm uppercase tracking-wider">In Progress</h2>
          </div>
          <span id="count-inprogress" class="px-2.5 py-0.5 bg-slate-800 border border-slate-700 text-slate-400 text-xs rounded-full font-semibold">0</span>
        </div>
        <div id="col-inprogress" data-status="inprogress" class="kanban-column flex flex-col gap-3 transition-colors rounded-xl p-1"></div>
      </div>

      <!-- Column: In Review -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col gap-4">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-sky-400"></span>
            <h2 class="font-bold text-slate-200 text-sm uppercase tracking-wider">In Review</h2>
          </div>
          <span id="count-review" class="px-2.5 py-0.5 bg-slate-800 border border-slate-700 text-slate-400 text-xs rounded-full font-semibold">0</span>
        </div>
        <div id="col-review" data-status="review" class="kanban-column flex flex-col gap-3 transition-colors rounded-xl p-1"></div>
      </div>

      <!-- Column: Done -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 flex flex-col gap-4">
        <div class="flex items-center justify-between pb-3 border-b border-slate-800">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-400"></span>
            <h2 class="font-bold text-slate-200 text-sm uppercase tracking-wider">Done</h2>
          </div>
          <span id="count-done" class="px-2.5 py-0.5 bg-slate-800 border border-slate-700 text-slate-400 text-xs rounded-full font-semibold">0</span>
        </div>
        <div id="col-done" data-status="done" class="kanban-column flex flex-col gap-3 transition-colors rounded-xl p-1"></div>
      </div>

    </div>
  </main>

  <!-- Add/Edit Task Modal -->
  <div id="task-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl flex flex-col gap-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modal-title" class="text-lg font-bold text-white">Add New Task</h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <form id="task-form" class="flex flex-col gap-4">
        <input type="hidden" id="task-id">

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Task Title</label>
          <input type="text" id="task-title" placeholder="e.g. Redesign Landing Page Hero" required
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Description</label>
          <textarea id="task-desc" rows="3" placeholder="Briefly describe what needs to be done..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Priority</label>
            <select id="task-priority" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
              <option value="low">Low Priority</option>
              <option value="medium" selected>Medium Priority</option>
              <option value="high">High Priority</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Due Date</label>
            <input type="date" id="task-date" required
                   class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="flex gap-2 justify-end pt-2 border-t border-slate-800">
          <button type="button" id="btn-cancel-modal" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl text-sm font-medium hover:bg-slate-700 transition">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium hover:bg-indigo-500 transition">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Sample Tasks
    const DEFAULT_TASKS = [
      { id: '1', title: 'Design System Guidelines', desc: 'Create unified color palettes and typography rules.', priority: 'high', date: '2026-11-15', status: 'todo' },
      { id: '2', title: 'REST API Optimization', desc: 'Improve query caching for faster weather dashboard response.', priority: 'medium', date: '2026-11-20', status: 'inprogress' },
      { id: '3', title: '3D CSS Card Flip Audit', desc: 'Test browser compatibility for flashcard app.', priority: 'low', date: '2026-10-30', status: 'review' },
      { id: '4', title: 'GitHub Pages Deployment', desc: 'Publish portfolio website to GitHub Pages.', priority: 'high', date: '2026-10-25', status: 'done' }
    ];

    let tasks = JSON.parse(localStorage.getItem('kanban_tasks')) || DEFAULT_TASKS;
    let draggedTaskId = null;

    // DOM References
    const columns = document.querySelectorAll('.kanban-column');
    const searchInput = document.getElementById('search-input');
    const priorityFilter = document.getElementById('priority-filter');
    const btnAddTask = document.getElementById('btn-add-task');
    const taskModal = document.getElementById('task-modal');
    const btnCloseModal = document.getElementById('btn-close-modal');
    const btnCancelModal = document.getElementById('btn-cancel-modal');
    const taskForm = document.getElementById('task-form');

    // Save Tasks
    function saveTasks() {
      localStorage.setItem('kanban_tasks', JSON.stringify(tasks));
    }

    // Priority Styling Helper
    function getPriorityBadge(priority) {
      if (priority === 'high') return '<span class="px-2 py-0.5 bg-rose-500/20 border border-rose-500/30 text-rose-400 text-[10px] font-bold rounded-md uppercase">High</span>';
      if (priority === 'medium') return '<span class="px-2 py-0.5 bg-amber-500/20 border border-amber-500/30 text-amber-400 text-[10px] font-bold rounded-md uppercase">Medium</span>';
      return '<span class="px-2 py-0.5 bg-slate-700 text-slate-300 text-[10px] font-bold rounded-md uppercase">Low</span>';
    }

    // Render Kanban Cards
    function renderBoard() {
      columns.forEach(col => col.innerHTML = '');

      const search = searchInput.value.toLowerCase().trim();
      const filter = priorityFilter.value;

      const filtered = tasks.filter(t => {
        const matchesSearch = t.title.toLowerCase().includes(search) || t.desc.toLowerCase().includes(search);
        const matchesPriority = filter === 'all' || t.priority === filter;
        return matchesSearch && matchesPriority;
      });

      const counts = { todo: 0, inprogress: 0, review: 0, done: 0 };

      filtered.forEach(task => {
        counts[task.status]++;
        const container = document.getElementById(`col-${task.status}`);
        if (!container) return;

        const isOverdue = task.status !== 'done' && new Date(task.date) < new Date().setHours(0,0,0,0);

        const card = document.createElement('div');
        card.className = "bg-slate-800/90 border border-slate-700/80 rounded-xl p-4 shadow-lg cursor-grab active:cursor-grabbing hover:border-indigo-500/50 transition flex flex-col gap-3 group relative";
        card.draggable = true;
        card.dataset.id = task.id;

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-bold text-slate-100 text-sm leading-snug">${task.title}</h3>
            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
              <button onclick="editTask('${task.id}')" class="text-slate-400 hover:text-indigo-400 p-1"><i class="fa-solid fa-pen text-xs"></i></button>
              <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-400 p-1"><i class="fa-solid fa-trash text-xs"></i></button>
            </div>
          </div>

          ${task.desc ? `<p class="text-slate-400 text-xs line-clamp-2">${task.desc}</p>` : ''}

          <div class="flex items-center justify-between pt-2 border-t border-slate-700/60 mt-1">
            ${getPriorityBadge(task.priority)}
            <div class="flex items-center gap-1.5 text-[11px] ${isOverdue ? 'text-rose-400 font-semibold' : 'text-slate-400'}">
              <i class="fa-regular fa-calendar"></i>
              <span>${task.date}</span>
            </div>
          </div>
        `;

        // Drag Events
        card.addEventListener('dragstart', (e) => {
          draggedTaskId = task.id;
          card.classList.add('dragging');
          e.dataTransfer.setData('text/plain', task.id);
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedTaskId = null;
        });

        container.appendChild(card);
      });

      // Update Column Counts
      document.getElementById('count-todo').textContent = counts.todo;
      document.getElementById('count-inprogress').textContent = counts.inprogress;
      document.getElementById('count-review').textContent = counts.review;
      document.getElementById('count-done').textContent = counts.done;
    }

    // Drag and Drop Column Handlers
    columns.forEach(col => {
      col.addEventListener('dragover', (e) => {
        e.preventDefault();
        col.classList.add('drag-over');
      });

      col.addEventListener('dragleave', () => col.classList.remove('drag-over'));

      col.addEventListener('drop', (e) => {
        e.preventDefault();
        col.classList.remove('drag-over');
        const taskId = e.dataTransfer.getData('text/plain') || draggedTaskId;
        const newStatus = col.dataset.status;

        const task = tasks.find(t => t.id === taskId);
        if (task && task.status !== newStatus) {
          task.status = newStatus;
          saveTasks();
          renderBoard();
        }
      });
    });

    // Delete Task
    window.deleteTask = function(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderBoard();
    };

    // Edit Task
    window.editTask = function(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('task-id').value = task.id;
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-desc').value = task.desc;
      document.getElementById('task-priority').value = task.priority;
      document.getElementById('task-date').value = task.date;
      document.getElementById('modal-title').textContent = "Edit Task";

      taskModal.classList.remove('hidden');
    };

    // Modal Events
    btnAddTask.addEventListener('click', () => {
      taskForm.reset();
      document.getElementById('task-id').value = '';
      document.getElementById('task-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('modal-title').textContent = "Add New Task";
      taskModal.classList.remove('hidden');
    });

    btnCloseModal.addEventListener('click', () => taskModal.classList.add('hidden'));
    btnCancelModal.addEventListener('click', () => taskModal.classList.add('hidden'));

    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('task-id').value;
      const title = document.getElementById('task-title').value.trim();
      const desc = document.getElementById('task-desc').value.trim();
      const priority = document.getElementById('task-priority').value;
      const date = document.getElementById('task-date').value;

      if (id) {
        const task = tasks.find(t => t.id === id);
        if (task) {
          task.title = title;
          task.desc = desc;
          task.priority = priority;
          task.date = date;
        }
      } else {
        tasks.push({
          id: Date.now().toString(),
          title,
          desc,
          priority,
          date,
          status: 'todo'
        });
      }

      saveTasks();
      taskModal.classList.add('hidden');
      renderBoard();
    });

    // Search and Filter Listeners
    searchInput.addEventListener('input', renderBoard);
    priorityFilter.addEventListener('change', renderBoard);

    // Initial Load
    renderBoard();
  </script>
</body>
</html>
